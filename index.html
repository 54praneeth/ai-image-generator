<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="light" />
<title>AI Image Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --bg: #ffffff;
    --ink: #0a0a0a;
    --muted: #6e6e6e;
    --line: #dcdcdc;
    --line-soft: #ececec;
    --surface: #fafafa;
    --canvas-bg: #0a0a0a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  .wrap {
    max-width: 860px;
    margin: 0 auto;
    padding: 64px 20px 60px;
  }
  header.top {
    text-align: center;
    margin-bottom: 40px;
  }
  header.top h1 {
    font-size: clamp(24px, 4vw, 32px);
    font-weight: 700;
    margin: 0 0 8px;
    letter-spacing: -0.02em;
  }
  header.top p {
    margin: 0;
    color: var(--muted);
    font-size: 15px;
  }
  .card {
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 32px clamp(18px, 4vw, 40px);
  }
  .hidden { display: none !important; }

  /* Prompt screen */
  #promptScreen form.prompt-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  #promptInput {
    flex: 1 1 280px;
    padding: 13px 16px;
    font-size: 15px;
    border-radius: 2px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--ink);
    font-family: inherit;
  }
  #promptInput::placeholder { color: #9a9a9a; }
  #promptInput:focus { outline: none; border-color: var(--ink); }
  #promptScreen button.primary {
    padding: 13px 24px;
    font-size: 15px;
    border-radius: 2px;
    border: 1px solid var(--ink);
    background: var(--ink);
    color: #fff;
    cursor: pointer;
    font-family: inherit;
    font-weight: 600;
  }
  #promptScreen button.primary:hover { background: #2b2b2b; }
  #promptScreen button.primary:disabled { opacity: 0.4; cursor: default; }

  .options-row {
    margin-top: 16px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  .options-row label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    display: block;
    margin-bottom: 5px;
  }
  .options-row select {
    padding: 8px 10px;
    border-radius: 2px;
    border: 1px solid var(--line);
    background: var(--bg);
    font-family: inherit;
    color: var(--ink);
    font-size: 13px;
  }

  .chips {
    margin-top: 22px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .chips button {
    padding: 7px 13px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--muted);
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
  }
  .chips button:hover { border-color: var(--ink); color: var(--ink); }

  .error-box {
    margin-top: 16px;
    padding: 12px 14px;
    border-radius: 2px;
    background: var(--surface);
    border: 1px solid var(--ink);
    color: var(--ink);
    font-size: 14px;
  }

  .hint {
    margin-top: 20px;
    font-size: 13px;
    color: var(--muted);
  }

  /* Generation screen */
  #genScreen .gen-meta {
    text-align: center;
    margin-bottom: 18px;
  }
  #genScreen .gen-meta h2 {
    margin: 0 0 4px;
    font-size: clamp(17px, 3vw, 21px);
    font-weight: 600;
  }
  #genScreen .gen-meta .status {
    color: var(--muted);
    font-size: 13px;
  }
  #canvasWrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    background: var(--canvas-bg);
    border: 1px solid var(--ink);
    border-radius: 2px;
    padding: 0;
    position: relative;
    width: fit-content;
    max-width: 100%;
    margin: 0 auto;
  }
  #paintCanvas {
    display: block;
    max-width: 100%;
    height: auto;
    background: var(--canvas-bg);
  }

  .progress-row {
    margin-top: 18px;
  }
  .progress-track {
    width: 100%;
    height: 3px;
    background: var(--line-soft);
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: var(--ink);
    transition: width 0.1s linear;
  }
  .progress-label {
    margin-top: 9px;
    font-size: 13px;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
  }

  .controls-row {
    margin-top: 24px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    justify-content: space-between;
  }
  .controls-left { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .controls-left label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
  select#speedSelect {
    padding: 8px 10px;
    border-radius: 2px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--ink);
    font-family: inherit;
  }
  select option {
    background: var(--bg);
    color: var(--ink);
  }
  .btn {
    padding: 10px 16px;
    border-radius: 2px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--ink);
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
  }
  .btn:hover { border-color: var(--ink); }
  .btn.primary {
    background: var(--ink);
    color: #fff;
    border: 1px solid var(--ink);
    font-weight: 600;
  }
  .btn.primary:hover { background: #2b2b2b; }
  .btn:disabled { opacity: 0.4; cursor: default; }

  .source-line {
    margin-top: 16px;
    font-size: 12px;
    color: var(--muted);
    text-align: center;
  }
  .source-line a { color: var(--ink); }

  footer.foot {
    text-align: center;
    margin-top: 26px;
    color: var(--muted);
    font-size: 12px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>AI Image Studio</h1>
    <p>Describe anything you can imagine — watch the AI paint it into existence, pixel by pixel.</p>
  </header>

  <div class="card">
    <section id="promptScreen">
      <form id="promptForm" class="prompt-row">
        <input
          id="promptInput"
          type="text"
          placeholder="e.g. a fox reading a book under cherry blossoms"
          autocomplete="off"
          required
        />
        <button type="submit" class="primary" id="submitBtn">Generate</button>
      </form>

      <div class="options-row">
        <div>
          <label for="styleSelect">Style</label>
          <select id="styleSelect"></select>
        </div>
        <div>
          <label for="sizeSelect">Shape</label>
          <select id="sizeSelect"></select>
        </div>
      </div>

      <div class="chips" id="chips"></div>
      <p class="hint">Free to use — images are generated live by AI.</p>
    </section>

    <section id="genScreen" class="hidden">
      <div class="gen-meta">
        <h2 id="promptTitle">—</h2>
        <div class="status" id="statusLine">Generating…</div>
      </div>

      <div id="canvasWrapper">
        <canvas id="paintCanvas" width="600" height="400"></canvas>
      </div>

      <div class="progress-row">
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-label">
          <span id="progressText">Contacting the AI…</span>
          <span id="progressPct">0%</span>
        </div>
      </div>

      <div class="controls-row">
        <div class="controls-left">
          <label for="speedSelect">Reveal speed</label>
          <select id="speedSelect">
            <option value="slow">Slow</option>
            <option value="normal" selected>Normal</option>
            <option value="fast">Fast</option>
          </select>
        </div>
        <div class="controls-left">
          <button class="btn" id="regenBtn">Regenerate</button>
          <button class="btn" id="downloadBtn" disabled>Download PNG</button>
          <button class="btn primary" id="anotherBtn">New prompt</button>
        </div>
      </div>

      <div class="source-line" id="sourceLine"></div>
    </section>

    <div id="errorBox" class="error-box hidden"></div>
  </div>

  <footer class="foot">Images are generated on the fly by a public AI model and may vary each time.</footer>
</div>

<script>
(function () {
  "use strict";

  const STYLES = [
    { label: "No style", suffix: "" },
    { label: "Digital art", suffix: ", digital art, highly detailed, trending on artstation" },
    { label: "Oil painting", suffix: ", oil painting, fine art, canvas texture" },
    { label: "Watercolor", suffix: ", watercolor painting, soft colors" },
    { label: "Anime", suffix: ", anime style, studio quality" },
    { label: "Photorealistic", suffix: ", photorealistic, 8k, sharp focus" },
    { label: "Cyberpunk", suffix: ", cyberpunk neon style, futuristic" },
    { label: "Pixel art", suffix: ", pixel art, 16-bit" },
    { label: "Fantasy", suffix: ", fantasy concept art, epic lighting" },
  ];

  const SIZES = [
    { label: "Square", w: 768, h: 768 },
    { label: "Portrait", w: 640, h: 896 },
    { label: "Landscape", w: 896, h: 640 },
  ];

  const EXAMPLE_PROMPTS = [
    "a fox reading a book under cherry blossoms",
    "an astronaut riding a horse on Mars",
    "a cozy cabin in a snowy forest at night",
    "a dragon curled around a mountain peak",
    "a city floating among the clouds",
    "a robot tending a rooftop garden",
    "an underwater library full of glowing fish",
    "a lighthouse during a thunderstorm",
  ];

  const SPEED_PRESETS = {
    slow:   { phase1: 3400, phase2: 6000 },
    normal: { phase1: 2200, phase2: 3600 },
    fast:   { phase1: 1200, phase2: 1900 },
  };

  const promptScreen = document.getElementById('promptScreen');
  const genScreen = document.getElementById('genScreen');
  const promptForm = document.getElementById('promptForm');
  const promptInput = document.getElementById('promptInput');
  const submitBtn = document.getElementById('submitBtn');
  const errorBox = document.getElementById('errorBox');
  const chipsEl = document.getElementById('chips');
  const styleSelect = document.getElementById('styleSelect');
  const sizeSelect = document.getElementById('sizeSelect');

  const promptTitleEl = document.getElementById('promptTitle');
  const statusLine = document.getElementById('statusLine');
  const canvas = document.getElementById('paintCanvas');
  const canvasWrapper = document.getElementById('canvasWrapper');
  const ctx = canvas.getContext('2d');
  const progressFill = document.getElementById('progressFill');
  const progressText = document.getElementById('progressText');
  const progressPct = document.getElementById('progressPct');
  const speedSelect = document.getElementById('speedSelect');
  const downloadBtn = document.getElementById('downloadBtn');
  const anotherBtn = document.getElementById('anotherBtn');
  const regenBtn = document.getElementById('regenBtn');
  const sourceLine = document.getElementById('sourceLine');

  let runId = 0;
  let lastPrompt = '';

  STYLES.forEach((s, i) => {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = s.label;
    styleSelect.appendChild(opt);
  });

  SIZES.forEach((s, i) => {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = s.label;
    sizeSelect.appendChild(opt);
  });

  EXAMPLE_PROMPTS.forEach(p => {
    const chip = document.createElement('button');
    chip.type = 'button';
    chip.textContent = p;
    chip.addEventListener('click', () => {
      promptInput.value = p;
      startGeneration(p);
    });
    chipsEl.appendChild(chip);
  });

  promptForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const val = promptInput.value.trim();
    if (val) startGeneration(val);
  });

  anotherBtn.addEventListener('click', () => {
    runId++; // cancel any in-flight animation
    genScreen.classList.add('hidden');
    promptScreen.classList.remove('hidden');
    promptInput.value = '';
    promptInput.focus();
    downloadBtn.disabled = true;
  });

  regenBtn.addEventListener('click', () => {
    if (lastPrompt) startGeneration(lastPrompt, true);
  });

  downloadBtn.addEventListener('click', () => {
    try {
      const link = document.createElement('a');
      link.download = (lastPrompt || 'ai-image').slice(0, 60).replace(/\s+/g, '_') + '.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    } catch (err) {
      showError("This image can't be exported as a PNG (the AI provider blocks pixel-level export for anonymous requests). Take a screenshot instead if you'd like to save it.");
    }
  });

  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.classList.remove('hidden');
  }
  function clearError() {
    errorBox.classList.add('hidden');
    errorBox.textContent = '';
  }

  function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function easeInOutCubic(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
  }

  function setProgress(frac, label) {
    const pct = Math.round(clamp(frac, 0, 1) * 100);
    progressFill.style.width = pct + '%';
    progressPct.textContent = pct + '%';
    if (label) progressText.textContent = label;
  }

  function buildImageUrl(prompt, styleIdx, sizeIdx, seed) {
    const style = STYLES[styleIdx] || STYLES[0];
    const size = SIZES[sizeIdx] || SIZES[0];
    const fullPrompt = prompt + style.suffix;
    const params = new URLSearchParams({
      width: String(size.w),
      height: String(size.h),
      nologo: 'true',
      seed: String(seed),
    });
    return {
      url: `https://image.pollinations.ai/prompt/${encodeURIComponent(fullPrompt)}?${params.toString()}`,
      size,
    };
  }

  // Primary image backend: Hugging Face Inference Providers, running the
  // (free, ungated) Qwen/Qwen-Image model. This needs a personal access
  // token scoped to "Inference Providers" — see the comment on HF_TOKEN
  // below for how to get one. Falls back to Pollinations.ai automatically
  // (see startGeneration) if no token is set or the call fails for any
  // reason (rate limit, cold start timeout, network error, etc).
  //
  // Get a free token: huggingface.co/settings/tokens -> "Create new token"
  // -> "Fine-grained" -> enable only "Make calls to Inference Providers".
  const HF_TOKEN = "REPLACE_WITH_YOUR_HF_TOKEN";

  let hfClientPromise = null;
  function getHfClient() {
    if (!hfClientPromise) {
      hfClientPromise = import('https://esm.sh/@huggingface/inference').then(
        mod => new mod.InferenceClient(HF_TOKEN)
      );
    }
    return hfClientPromise;
  }

  function withTimeout(promise, timeoutMs) {
    return new Promise((resolve, reject) => {
      const timer = setTimeout(() => reject(new Error('timeout')), timeoutMs);
      promise.then(
        v => { clearTimeout(timer); resolve(v); },
        e => { clearTimeout(timer); reject(e); }
      );
    });
  }

  async function generateWithHf(prompt, styleIdx, sizeIdx, seed, timeoutMs) {
    if (!HF_TOKEN || HF_TOKEN.startsWith('REPLACE_')) throw new Error('no token configured');
    const style = STYLES[styleIdx] || STYLES[0];
    const size = SIZES[sizeIdx] || SIZES[0];
    const client = await getHfClient();
    const blob = await withTimeout(
      client.textToImage({
        model: 'Qwen/Qwen-Image',
        inputs: prompt + style.suffix,
        parameters: { width: size.w, height: size.h, seed },
      }),
      timeoutMs
    );
    return { url: URL.createObjectURL(blob), size, isBlob: true };
  }

  function loadImage(url, timeoutMs) {
    // Note: deliberately NOT setting img.crossOrigin here. Pollinations.ai's
    // bot-protection rejects anonymous/CORS-mode image requests, but allows
    // plain same-as-a-normal-<img> loads. This means the resulting canvas is
    // "tainted" (no getImageData/toDataURL), which is fine since the reveal
    // animation only ever uses drawImage, never reads pixel data back.
    return new Promise((resolve, reject) => {
      const img = new Image();
      let settled = false;
      const timer = setTimeout(() => {
        if (!settled) { settled = true; reject(new Error('timeout')); }
      }, timeoutMs);
      img.onload = () => {
        if (settled) return;
        settled = true;
        clearTimeout(timer);
        resolve(img);
      };
      img.onerror = () => {
        if (settled) return;
        settled = true;
        clearTimeout(timer);
        reject(new Error('load error'));
      };
      img.src = url;
    });
  }

  function hslToRgb(h, s, l) {
    s /= 100; l /= 100;
    const k = n => (n + h / 30) % 12;
    const a = s * Math.min(l, 1 - l);
    const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
    return { r: 255 * f(0), g: 255 * f(8), b: 255 * f(4) };
  }

  function pickPalette(n) {
    const baseHue = Math.random() * 360;
    const colors = [];
    for (let i = 0; i < n; i++) {
      const hue = (baseHue + (i * 360) / n + (Math.random() * 24 - 12) + 360) % 360;
      colors.push(hslToRgb(hue, 55 + Math.random() * 30, 45 + Math.random() * 18));
    }
    return colors;
  }

  // A tiny live "diffusion" simulation: a coarse grid of RGB cells that is
  // continuously recomputed every frame (blurred toward its neighbors, pulled
  // toward a slowly-drifting target color, and jittered with noise). That mix
  // is what an actual diffusion model's denoising loop looks like — noise
  // resolving into structure — so instead of faking discrete "steps" we just
  // run the real thing at toy scale, live, while the real request is in flight.
  function targetColorAt(palette, nx, ny, timeMs) {
    const v = (
      Math.sin(nx * 6 + timeMs * 0.00025) +
      Math.sin(ny * 6 - timeMs * 0.00020) +
      Math.sin((nx + ny) * 5 + timeMs * 0.00018) + 3
    ) / 6;
    const idx = Math.min(palette.length - 1, Math.max(0, Math.floor(v * palette.length)));
    return palette[idx];
  }

  function makeDiffusionSim(w, h, palette) {
    const cols = clamp(Math.round(w / 16), 20, 56);
    const rows = Math.max(1, Math.round(cols * (h / w)));
    const grid = new Array(cols * rows);
    for (let i = 0; i < grid.length; i++) {
      grid[i] = { r: Math.random() * 255, g: Math.random() * 255, b: Math.random() * 255 };
    }
    return { cols, rows, grid, palette };
  }

  function stepDiffusionSim(sim, noiseLevel, timeMs) {
    const { cols, rows, grid, palette } = sim;
    const next = new Array(grid.length);
    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        let rs = 0, gs = 0, bs = 0, count = 0;
        for (let dy = -1; dy <= 1; dy++) {
          const ny = y + dy;
          if (ny < 0 || ny >= rows) continue;
          for (let dx = -1; dx <= 1; dx++) {
            const nx = x + dx;
            if (nx < 0 || nx >= cols) continue;
            const c = grid[ny * cols + nx];
            rs += c.r; gs += c.g; bs += c.b; count++;
          }
        }
        let r = rs / count, g = gs / count, b = bs / count;

        const target = targetColorAt(palette, x / cols, y / rows, timeMs);
        const pull = (1 - noiseLevel) * 0.06;
        r = lerp(r, target.r, pull);
        g = lerp(g, target.g, pull);
        b = lerp(b, target.b, pull);

        const jitter = noiseLevel * 55;
        r = clamp(r + (Math.random() - 0.5) * jitter, 0, 255);
        g = clamp(g + (Math.random() - 0.5) * jitter, 0, 255);
        b = clamp(b + (Math.random() - 0.5) * jitter, 0, 255);

        next[y * cols + x] = { r, g, b };
      }
    }
    sim.grid = next;
  }

  function renderDiffusionSim(ctx, sim, w, h) {
    const { cols, rows, grid } = sim;
    const cw = w / cols, ch = h / rows;
    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        const c = grid[y * cols + x];
        ctx.fillStyle = `rgb(${c.r | 0}, ${c.g | 0}, ${c.b | 0})`;
        ctx.fillRect(Math.floor(x * cw), Math.floor(y * ch), Math.ceil(cw), Math.ceil(ch));
      }
    }
  }

  // Runs the live simulation for as long as the real request takes. Every
  // ~5.5s it "restarts" (a fresh burst of noise, like trying a new sample)
  // with a brief flash, so it reads as an ongoing process rather than
  // something that finishes and idles if the network is slow.
  function startGenAnimation(myRunId, w, h) {
    canvas.width = w;
    canvas.height = h;
    ctx.imageSmoothingEnabled = false;

    const palette = pickPalette(6 + Math.floor(Math.random() * 3));
    const sim = makeDiffusionSim(w, h, palette);
    const passDuration = 5500;
    const startTime = performance.now();
    let raf;
    let lastStepTime = 0;
    const stepInterval = 1000 / 30;

    function frame(now) {
      if (myRunId !== runId) return;
      const timeMs = now - startTime;
      const cyclePos = (timeMs % passDuration) / passDuration;
      const noiseLevel = clamp(1 - cyclePos * 0.93, 0.07, 1);

      if (now - lastStepTime >= stepInterval) {
        if (cyclePos < 0.015 && lastStepTime > 0) {
          // fresh burst of noise at the start of each pass
          for (let i = 0; i < sim.grid.length; i++) {
            sim.grid[i] = { r: Math.random() * 255, g: Math.random() * 255, b: Math.random() * 255 };
          }
        }
        stepDiffusionSim(sim, noiseLevel, timeMs);
        lastStepTime = now;
      }
      renderDiffusionSim(ctx, sim, w, h);

      if (cyclePos < 0.06) {
        const flashAlpha = ((0.06 - cyclePos) / 0.06) * 0.3;
        ctx.fillStyle = `rgba(255,255,255,${flashAlpha.toFixed(2)})`;
        ctx.fillRect(0, 0, w, h);
      }

      let label;
      if (cyclePos < 0.06) label = 'Sampling a fresh idea…';
      else if (noiseLevel > 0.7) label = 'Exploring rough shapes…';
      else if (noiseLevel > 0.4) label = 'Composing the scene…';
      else if (noiseLevel > 0.18) label = 'Refining details…';
      else label = 'Polishing pixels…';
      progressText.textContent = label;

      raf = requestAnimationFrame(frame);
    }
    raf = requestAnimationFrame(frame);
    return () => cancelAnimationFrame(raf);
  }

  async function startGeneration(prompt, isRegen) {
    clearError();
    lastPrompt = prompt;
    submitBtn.disabled = true;
    regenBtn.disabled = true;

    const myRunId = ++runId;
    const styleIdx = Number(styleSelect.value || 0);
    const sizeIdx = Number(sizeSelect.value || 0);
    const seed = Math.floor(Math.random() * 1e9);
    const fallback = buildImageUrl(prompt, styleIdx, sizeIdx, seed);
    const size = fallback.size;

    promptScreen.classList.add('hidden');
    genScreen.classList.remove('hidden');
    downloadBtn.disabled = true;
    promptTitleEl.textContent = '"' + prompt + '"';
    statusLine.textContent = 'The AI is generating your image…';
    setProgress(0, 'Contacting the AI…');

    // Fit the preview canvas to the target image's aspect ratio.
    const maxW = Math.min(900, canvasWrapper.clientWidth || 860, window.innerWidth - 60);
    const maxH = Math.min(680, window.innerHeight * 0.62);
    const scale = Math.min(maxW / size.w, maxH / size.h, 1);
    const previewW = Math.max(1, Math.round(size.w * scale));
    const previewH = Math.max(1, Math.round(size.h * scale));

    const stopGenAnim = startGenAnimation(myRunId, previewW, previewH);

    let img;
    let source = 'pollinations';
    try {
      const hf = await generateWithHf(prompt, styleIdx, sizeIdx, seed, 45000);
      img = await loadImage(hf.url, 15000);
      source = 'hf';
    } catch (hfErr) {
      try {
        img = await loadImage(fallback.url, 90000);
      } catch (err) {
        stopGenAnim();
        if (myRunId === runId) {
          showError(
            err.message === 'timeout'
              ? "The AI is taking too long to respond. Please try again."
              : "The AI couldn't generate that image. Please try a different prompt."
          );
          genScreen.classList.add('hidden');
          promptScreen.classList.remove('hidden');
        }
        submitBtn.disabled = false;
        regenBtn.disabled = false;
        return;
      }
    }

    stopGenAnim();
    if (myRunId !== runId) return;

    submitBtn.disabled = false;
    regenBtn.disabled = false;
    statusLine.textContent = 'Painting it onto the canvas…';
    sourceLine.innerHTML = source === 'hf'
      ? 'Powered by <a href="https://huggingface.co/Qwen/Qwen-Image" target="_blank" rel="noopener">Hugging Face (Qwen-Image)</a>'
      : 'Powered by <a href="https://pollinations.ai" target="_blank" rel="noopener">Pollinations.ai</a>';

    await paint(img, myRunId);
    if (myRunId === runId) {
      statusLine.textContent = 'Done!';
      downloadBtn.disabled = false;
    }
  }

  async function paint(img, myRunId) {
    const maxW = Math.min(900, canvasWrapper.clientWidth || 860, window.innerWidth - 60);
    const maxH = Math.min(680, window.innerHeight * 0.62);
    const scale = Math.min(maxW / img.naturalWidth, maxH / img.naturalHeight, 1);
    const w = Math.max(1, Math.round(img.naturalWidth * scale));
    const h = Math.max(1, Math.round(img.naturalHeight * scale));

    canvas.width = w;
    canvas.height = h;

    const fullCanvas = document.createElement('canvas');
    fullCanvas.width = w;
    fullCanvas.height = h;
    const fullCtx = fullCanvas.getContext('2d');
    fullCtx.imageSmoothingEnabled = true;
    fullCtx.drawImage(img, 0, 0, w, h);

    ctx.imageSmoothingEnabled = false;
    ctx.fillStyle = '#17132a';
    ctx.fillRect(0, 0, w, h);

    const speed = SPEED_PRESETS[speedSelect.value] || SPEED_PRESETS.normal;
    const cellSize = clamp(Math.round(Math.min(w, h) / 90), 5, 14);
    const cols = Math.ceil(w / cellSize);
    const rows = Math.ceil(h / cellSize);

    const tmp = document.createElement('canvas');
    const tctx = tmp.getContext('2d');

    setProgress(0, 'Sketching composition…');

    // Phase 1: coarse-to-fine blocky pass
    await new Promise(resolve => {
      const t0 = performance.now();
      function frame(now) {
        if (myRunId !== runId) return resolve();
        const t = Math.min(1, (now - t0) / speed.phase1);
        const eased = easeInOutCubic(t);
        const gridW = clamp(Math.round(lerp(4, cols, eased)), 4, cols);
        const gridH = Math.max(1, Math.round(gridW * (h / w)));

        tmp.width = gridW;
        tmp.height = gridH;
        tctx.imageSmoothingEnabled = true;
        tctx.drawImage(fullCanvas, 0, 0, w, h, 0, 0, gridW, gridH);
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(tmp, 0, 0, gridW, gridH, 0, 0, w, h);

        setProgress(t * 0.45, 'Sketching composition…');
        if (t < 1) requestAnimationFrame(frame); else resolve();
      }
      requestAnimationFrame(frame);
    });
    if (myRunId !== runId) return;

    // Phase 2: reveal true-resolution cells in random order
    const cellIndices = [];
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) cellIndices.push(r * cols + c);
    }
    shuffle(cellIndices);
    const total = cellIndices.length;
    let revealed = 0;

    await new Promise(resolve => {
      const t1 = performance.now();
      function frame(now) {
        if (myRunId !== runId) return resolve();
        const t = Math.min(1, (now - t1) / speed.phase2);
        const targetRevealed = Math.round(total * t);
        while (revealed < targetRevealed) {
          const idx = cellIndices[revealed];
          const r = Math.floor(idx / cols);
          const c = idx % cols;
          const x = c * cellSize;
          const y = r * cellSize;
          const cw = Math.min(cellSize, w - x);
          const ch = Math.min(cellSize, h - y);
          ctx.drawImage(fullCanvas, x, y, cw, ch, x, y, cw, ch);
          revealed++;
        }
        setProgress(0.45 + t * 0.55, 'Adding pixel detail…');
        if (t < 1) requestAnimationFrame(frame); else resolve();
      }
      requestAnimationFrame(frame);
    });
    if (myRunId !== runId) return;

    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(fullCanvas, 0, 0);
    setProgress(1, 'Finished');
  }
})();
</script>
